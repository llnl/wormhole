apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "piko.fullname" . }}
  labels:
    {{- include "piko.labels" . | nindent 4 }}
data:
  server.yaml: |
    cluster:
      node_id_prefix: ${POD_NAME}-
      join:
        - {{ include "piko.fullname" . }}
{{- if .Values.auth.enabled }}
    upstream:
      auth:
        disable_disconnect_on_expiry: {{ .Values.auth.disable_disconnect_on_expiry }}
        jwks:
          endpoint: {{ .Values.auth.jwks.endpoint | quote }}
          cache_ttl: {{ .Values.auth.jwks.cache_ttl | quote }}
          timeout: {{ .Values.auth.jwks.timeout | quote }}
{{- end }}
