apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rabbitmq.fullname" . }}-config
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
data:
  rabbitmq.conf: |
    # Kubernetes peer discovery
    cluster_formation.peer_discovery_backend = k8s

    # Kubernetes settings
    cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type = hostname
    cluster_formation.k8s.service_name = {{ include "rabbitmq.fullname" . }}-headless

    # Node naming
    cluster_formation.node_cleanup.interval = 10
    cluster_formation.node_cleanup.only_log_warning = true

    # Cluster formation settings
    cluster_partition_handling = autoheal

    # Queue master locator
    queue_master_locator = min-masters

    # Logging
    log.console = true
    log.console.level = info

{{- if .Values.config.extraConfig }}
{{ .Values.config.extraConfig | indent 4 }}
{{- end }}

  enabled_plugins: |
    [rabbitmq_management,rabbitmq_peer_discovery_k8s].
