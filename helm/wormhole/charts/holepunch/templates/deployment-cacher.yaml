{{- if .Values.cacher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "holepunch.fullname" . }}-cacher
  labels:
    {{- include "holepunch.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "holepunch.name" . }}-cacher
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "holepunch.name" . }}-cacher
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.global.serviceAccount.name | default "default" }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: holepunch
          image: {{ include "holepunch.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["cacher"]
          env:
            - name: HOLEPUNCH_LOGGING_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: HOLEPUNCH_REGISTRY_HOST
              value: {{ printf "http://%s:%d" (include "holepunch.routeRegistryName" .) (int .Values.dependencies.routeRegistry.port) | quote }}
            - name: HOLEPUNCH_TOKEN_HOST
              value: {{ printf "http://%s:%d" (include "holepunch.tokenServiceName" .) (int .Values.dependencies.tokenService.port) | quote }}
            - name: HOLEPUNCH_STORAGE_HOST
              value: {{ include "holepunch.natsHost" . | quote }}
            - name: HOLEPUNCH_STORAGE_USER
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: username
            - name: HOLEPUNCH_STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: password
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.cacher.resources | nindent 12 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
