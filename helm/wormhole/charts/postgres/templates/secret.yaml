{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.secretName" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  postgres-password: {{ .Values.auth.postgresPassword | quote }}
  token-service-username: {{ .Values.auth.tokenServiceUser | quote }}
  token-service-password: {{ .Values.auth.tokenServicePassword | quote }}
  route-registry-username: {{ .Values.auth.routeRegistryUser | quote }}
  route-registry-password: {{ .Values.auth.routeRegistryPassword | quote }}
{{- end }}
