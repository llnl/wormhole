apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgres.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "postgres.podSecurityContext" . | nindent 8 }}
      containers:
        - name: postgresql
          {{- if eq .Values.imageVariant "redhat" }}
          image: {{ .Values.redhat.image.registry }}/{{ .Values.redhat.image.repository }}:{{ .Values.redhat.image.tag }}
          {{- else }}
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if eq .Values.imageVariant "redhat" }}
            # Red Hat image uses POSTGRESQL_* environment variables
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.secretName" . }}
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.secretName" . }}
                  key: password
            - name: POSTGRESQL_DATABASE
              value: {{ .Values.auth.database | quote }}
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.secretName" . }}
                  key: postgres-password
            {{- else }}
            # Official image uses POSTGRES_* environment variables
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.secretName" . }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.secretName" . }}
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- end }}
            # Application user configuration for init script
            - name: TOKEN_SERVICE_USER
              value: {{ .Values.auth.tokenServiceUser | quote }}
            - name: TOKEN_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.secretName" . }}
                  key: token-service-password
            - name: TOKEN_SERVICE_DATABASE
              value: {{ .Values.auth.tokenServiceDatabase | quote }}
            - name: ROUTE_REGISTRY_USER
              value: {{ .Values.auth.routeRegistryUser | quote }}
            - name: ROUTE_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.secretName" . }}
                  key: route-registry-password
            - name: ROUTE_REGISTRY_DATABASE
              value: {{ .Values.auth.routeRegistryDatabase | quote }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                {{- if eq .Values.imageVariant "redhat" }}
                - pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
                {{- else }}
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                {{- if eq .Values.imageVariant "redhat" }}
                - pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
                {{- else }}
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              {{- if eq .Values.imageVariant "redhat" }}
              mountPath: /var/lib/pgsql/data
              {{- else }}
              mountPath: /var/lib/postgresql/data
              {{- end }}
            {{- if .Values.initdb.scripts }}
            - name: initdb-scripts
              {{- if eq .Values.imageVariant "redhat" }}
              mountPath: /usr/share/container-scripts/postgresql/start
              {{- else }}
              mountPath: /docker-entrypoint-initdb.d
              {{- end }}
            {{- end }}
          securityContext:
            {{- include "postgres.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.initdb.scripts }}
        - name: initdb-scripts
          configMap:
            name: {{ include "postgres.fullname" . }}-initdb
            defaultMode: 0755
        {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- else }}
        - name: data
          emptyDir: {}
  {{- end }}
